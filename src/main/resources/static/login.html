<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Java Interview Assistant</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111827;
    }

    .login-container {
        width: 380px;
        background: #1f2937;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    h2 {
        text-align: center;
        color: white;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #d1d5db;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #374151;
        border-radius: 7px;
        outline: none;
        background: #111827;
        color: white;
    }

    input:focus {
        border-color: #2563eb;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        color: #d1d5db;
    }

    .register-link a {
        color: #60a5fa;
        text-decoration: none;
    }
  </style>
</head>

<body>

<div class="login-container">

  <h2>Login</h2>

  <form method="post" action="/login">

    <div class="form-group">
      <label>Email</label>
      <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
              type="password"
              name="password"
              placeholder="Enter your password"
              required>
    </div>

    <button type="submit">Login</button>

  </form>

  <div class="register-link">
    Don't have an account?
    <a href="/register.html">Register</a>
  </div>

</div>

</body>
</html>
